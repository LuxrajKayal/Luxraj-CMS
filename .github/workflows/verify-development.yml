name: Verify development changes
on:
  push:
    branches: [codex-development]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Typecheck, frontend tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GITHUB_CONNECTION_ENABLED: 'true'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/github-workspace/index.ts supabase/functions/github-connection/index.ts
      - run: deno test --allow-env supabase/functions
