name: Verify development changes
on:
  push:
    branches: [codex-development]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Typecheck, frontend tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GITHUB_CONNECTION_ENABLED: 'true'
